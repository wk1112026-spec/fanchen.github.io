<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>汽水点歌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #121217;
            color: #e0e0e0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .back-arrow {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #64b5f6;
    font-size: 24px;
    text-decoration: none;
    z-index: 999;
    font-weight: bold;
}

        .container {
            width: 100%;
            max-width: 380px;
            margin: 50px auto 40px;
            background-color: #18181f;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #64b5f6, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .input-box {
            width: 100%;
            background-color: #1e1e28;
            border: 1.5px solid #2a2a36;
            border-radius: 14px;
            padding: 13px 16px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
            transition: border 0.2s, box-shadow 0.2s;
            caret-color: #64b5f6;
        }

        .input-box:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        .input-box::placeholder {
            color: #5a5a6e;
            font-size: 14px;
        }

        .btn-start {
            background: linear-gradient(90deg, #1976d2, #2196f3);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 18px rgba(25, 118, 210, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-start:hover {
            background: linear-gradient(90deg, #1565c0, #1e88e5);
        }

        .btn-start:active {
            transform: scale(0.97);
        }

        .status {
            text-align: center;
            margin-bottom: 16px;
            font-size: 13px;
            min-height: 20px;
            color: #ffb74d;
            font-weight: 500;
        }

        .status.error {
            color: #ef5350;
        }

        .status.success {
            color: #81c784;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2a2a36 transparent;
        }

        .song-list::-webkit-scrollbar {
            width: 4px;
        }

        .song-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .song-list::-webkit-scrollbar-thumb {
            background: #2a2a36;
            border-radius: 2px;
        }

        .song-item {
            background: #1e1e28;
            border: 1.5px solid #2a2a36;
            padding: 13px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .song-item:hover {
            background: #252535;
            border-color: #3a3a50;
        }

        .song-item.active {
            border-color: #64b5f6;
            background: #1a2632;
            box-shadow: 0 0 12px rgba(100, 181, 246, 0.15);
        }

        .song-index {
            width: 30px;
            height: 30px;
            background: #2a2a36;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #64b5f6;
            flex-shrink: 0;
        }

        .song-item.active .song-index {
            background: #64b5f6;
            color: #fff;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-name {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-singer {
            color: #7a7a8a;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-arrow {
            color: #5a5a6e;
            font-size: 16px;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .song-item.active .song-arrow {
            color: #64b5f6;
        }

        .player-wrapper {
            background: #0f0f14;
            border: 1px solid #2a2a36;
            border-radius: 16px;
            padding: 12px;
            margin-top: 4px;
        }

        .player-label {
            font-size: 12px;
            color: #6b6b7a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 10px;
            outline: none;
        }

        audio::-webkit-media-controls-panel {
            background-color: #1e1e28;
        }

        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #e0e0e0;
        }

        audio::-webkit-media-controls-play-button {
            filter: invert(0.8);
        }
    </style>
</head>
<body>
    <img src="https://acg.yaohud.cn/dm/AI.php" style="width:100%;height:100vh;object-fit:cover;position:fixed;top:0;left:0;z-index:-1;">
    <a href="music.html" class="back-arrow">‹</a>
    <div class="container">
        <div class="title">🎵 汽水点歌</div>

        <input type="text" id="key" class="input-box" placeholder="输入歌名搜索..." autocomplete="off">

        <button class="btn-start" onclick="searchList()">
            <span>🔍</span>
            搜索歌曲
        </button>

        <div id="status" class="status"></div>
        <div id="listBox" class="song-list"></div>

        <div class="player-wrapper" id="playerWrapper" style="display:none;">
            <div class="player-label">🎧 正在播放</div>
            <audio id="player" controls></audio>
        </div>
    </div>

    <script>
        let currentKeyword = '';

        function webCatFetch(url, callback) {
            if (typeof WebCat !== 'undefined' && WebCat.httpRequest) {
                WebCat.httpRequest({
                    url: url,
                    method: 'GET',
                    success: function(res) {
                        callback(res, null);
                    },
                    fail: function(err) {
                        callback(null, err);
                    }
                });
            } else {
                fetch(url)
                    .then(r => r.json())
                    .then(d => callback(d, null))
                    .catch(e => callback(null, e));
            }
        }

        function setStatus(msg, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = msg;
            statusEl.className = 'status';
            if (type === 'error') statusEl.classList.add('error');
            if (type === 'success') statusEl.classList.add('success');
        }

        function searchList() {
            const key = document.getElementById('key').value.trim();
            if (!key) return setStatus('请输入歌名', 'error');

            currentKeyword = key;
            setStatus('🔍 搜索中...', '');
            document.getElementById('listBox').innerHTML = '';
            document.getElementById('player').src = '';
            document.getElementById('playerWrapper').style.display = 'none';

            const url = `https://lengy.top/API/qsmusic.php?msg=${encodeURIComponent(key)}&num=5`;
            webCatFetch(url, function(data, err) {
                if (err) {
                    setStatus('请求出错：' + err.message, 'error');
                    return;
                }
                console.log('列表接口返回:', data);
                setStatus('', '');

                let list = [];
                if (Array.isArray(data)) {
                    list = data;
                } else if (data.list && Array.isArray(data.list)) {
                    list = data.list;
                } else if (data.data && Array.isArray(data.data)) {
                    list = data.data;
                } else {
                    setStatus('未找到相关歌曲', 'error');
                    return;
                }

                if (list.length === 0) {
                    setStatus('未找到相关歌曲', 'error');
                    return;
                }

                setStatus(`找到 ${list.length} 首歌曲`, 'success');

                list.forEach((song, index) => {
                    const n = index + 1;
                    const name = song.name || song.title || song.song || song.songName || '未知歌曲';
                    const singer = song.singer || song.author || song.artist || song.songer || song.artists || '未知歌手';

                    const item = document.createElement('div');
                    item.className = 'song-item';
                    item.innerHTML = `
                        <div class="song-index">${n}</div>
                        <div class="song-info">
                            <div class="song-name">${name}</div>
                            <div class="song-singer">${singer}</div>
                        </div>
                        <div class="song-arrow">▶</div>
                    `;
                    item.onclick = () => getSongUrl(n, name, singer, item);
                    document.getElementById('listBox').appendChild(item);
                });
            });
        }

        function getSongUrl(n, name, singer, itemEl) {
            document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
            itemEl.classList.add('active');
            setStatus('🎵 获取播放地址中...', '');

            const url = `https://lengy.top/API/qsmusic.php?msg=${encodeURIComponent(currentKeyword)}&num=15&n=${n}`;
            webCatFetch(url, function(data, err) {
                if (err) {
                    setStatus('请求出错：' + err.message, 'error');
                    return;
                }
                console.log('地址接口返回:', data);

                let playUrl = null;
                if (typeof data === 'object' && data !== null) {
                    playUrl = data.url || data.src || data.music_url || data.play_url ||
                              data.link || data.path || data.mp3 || data.audio || data.file ||
                              data.music || data.song_url || data.play;

                    if (!playUrl) {
                        for (let key in data) {
                            const val = data[key];
                            if (typeof val === 'string' && val.startsWith('http')) {
                                playUrl = val;
                                break;
                            }
                        }
                    }
                }

                if (playUrl) {
                    document.getElementById('player').src = playUrl;
                    document.getElementById('playerWrapper').style.display = 'block';
                    setStatus(`✅ 正在播放：${name} - ${singer}`, 'success');
                    document.querySelector('.player-label').innerText = `🎧 ${name} - ${singer}`;
                } else {
                    setStatus('获取播放地址失败，请尝试其他歌曲', 'error');
                }
            });
        }

        document.getElementById('key').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchList();
            }
        });
    </script>
</body>
</html>
