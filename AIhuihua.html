<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>AI绘画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #121217;
            color: #e0e0e0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .back-arrow {
    position: fixed;
    top: 20px;
    left: 20px;
    color: #64b5f6;
    font-size: 24px;
    text-decoration: none;
    z-index: 999;
    font-weight: bold;
}

        .container {
            width: 100%;
            max-width: 420px;
            margin: 50px auto 40px;
            background-color: #18181f;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            background: linear-gradient(135deg, #64b5f6, #42a5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .input-box {
            width: 100%;
            background-color: #1e1e28;
            border: 1.5px solid #2a2a36;
            border-radius: 14px;
            padding: 13px 16px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            margin-bottom: 14px;
            transition: border 0.2s, box-shadow 0.2s;
            caret-color: #64b5f6;
        }

        .input-box:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
        }

        .input-box::placeholder {
            color: #5a5a6e;
            font-size: 14px;
        }

        .btn-start {
            background: linear-gradient(90deg, #1976d2, #2196f3);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 18px rgba(25, 118, 210, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-start:hover {
            background: linear-gradient(90deg, #1565c0, #1e88e5);
        }

        .btn-start:active {
            transform: scale(0.97);
        }

        .btn-start:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .tip {
            text-align: center;
            margin-bottom: 16px;
            font-size: 13px;
            min-height: 20px;
            color: #ffb74d;
            font-weight: 500;
        }

        .tip.error {
            color: #ef5350;
        }

        .tip.success {
            color: #81c784;
        }

        .result-box {
            display: none;
            margin-top: 10px;
        }

        .result-box.show {
            display: block;
        }

        .result-img-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }

        .result-img-wrapper img {
            width: 100%;
            display: block;
            border-radius: 16px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-download {
            flex: 1;
            background: #1e1e28;
            border: 1.5px solid #2a2a36;
            color: #81c784;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-download:hover {
            background: #252535;
            border-color: #81c784;
        }

        .btn-view {
            flex: 1;
            background: #1e1e28;
            border: 1.5px solid #2a2a36;
            color: #64b5f6;
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-view:hover {
            background: #252535;
            border-color: #64b5f6;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 30px;
            color: #64b5f6;
            font-size: 14px;
        }

        .loading-spinner.show {
            display: block;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #2a2a36;
            border-top: 3px solid #64b5f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .preview-overlay.show {
            display: flex;
        }

        .preview-overlay img {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <img src="https://acg.yaohud.cn/dm/AI.php" style="width:100%;height:100vh;object-fit:cover;position:fixed;top:0;left:0;z-index:-1;">
    <a href="AI.html" class="back-arrow">‹</a>
    <div class="container">
        <div class="title">🎨 AI绘画</div>

        <input type="text" id="message" class="input-box" placeholder="描述你想画的画面..." autocomplete="off" value="">

        <button class="btn-start" id="drawBtn" onclick="startDraw()">
            <span>✨</span>
            开始生成
        </button>

        <div class="tip" id="tip"></div>
        <div class="loading-spinner" id="loadingBox">
            <div class="spinner"></div>
            正在生成中，请耐心等待...
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-img-wrapper" onclick="previewImg()">
                <img id="resultImg" src="" alt="AI生成图片">
            </div>
            <div class="btn-row">
                <a class="btn-download" id="downloadBtn" href="#" download>
                    <span>📥</span>
                    下载图片
                </a>
                <button class="btn-view" onclick="previewImg()">
                    <span>🔍</span>
                    查看大图
                </button>
            </div>
        </div>

        <div class="preview-overlay" id="previewOverlay" onclick="closePreview()">
            <img id="previewImg" src="">
        </div>
    </div>

    <script>
        const API_URL = 'https://ecyapi.cn/API/ai_draw_juhe.php';
        let currentImgUrl = '';

        function webCatFetch(url, callback) {
            if (typeof WebCat !== 'undefined' && WebCat.httpRequest) {
                WebCat.httpRequest({
                    url: url,
                    method: 'GET',
                    success: function(res) {
                        let data = res;
                        if (typeof res === 'string') {
                            try { data = JSON.parse(res); } catch (e) {}
                        }
                        callback(data, null);
                    },
                    fail: function(err) {
                        callback(null, err);
                    }
                });
            } else {
                fetch(url)
                    .then(r => r.text())
                    .then(txt => {
                        let data;
                        try { data = JSON.parse(txt); } catch (e) { data = txt; }
                        callback(data, null);
                    })
                    .catch(e => callback(null, e));
            }
        }

        function setTip(msg, type) {
            const tipEl = document.getElementById('tip');
            tipEl.innerText = msg;
            tipEl.className = 'tip';
            if (type === 'error') tipEl.classList.add('error');
            if (type === 'success') tipEl.classList.add('success');
        }

        function startDraw() {
            const message = document.getElementById('message').value.trim();
            if (!message) return setTip('请输入描述内容', 'error');

            document.getElementById('drawBtn').disabled = true;
            document.getElementById('resultBox').classList.remove('show');
            document.getElementById('loadingBox').classList.add('show');
            setTip('正在生成中...', '');

            const url = `${API_URL}?message=${encodeURIComponent(message)}`;

            webCatFetch(url, function(data, err) {
                document.getElementById('drawBtn').disabled = false;
                document.getElementById('loadingBox').classList.remove('show');

                if (err) {
                    setTip('请求失败：' + err.message, 'error');
                    return;
                }

                console.log('返回数据:', JSON.stringify(data));

                let imgUrl = null;
                if (typeof data === 'string' && data.startsWith('http')) {
                    imgUrl = data;
                } else if (typeof data === 'object' && data !== null) {
                    imgUrl = data.url || data.img || data.image || data.src || 
                              data.data?.url || data.data?.img || data.data?.image ||
                              data.result?.url || data.result?.img;
                    
                    if (!imgUrl) {
                        for (let key in data) {
                            const val = data[key];
                            if (typeof val === 'string' && val.startsWith('http')) {
                                imgUrl = val;
                                break;
                            }
                        }
                    }
                }

                if (imgUrl) {
                    currentImgUrl = imgUrl;
                    document.getElementById('resultImg').src = imgUrl;
                    document.getElementById('downloadBtn').href = imgUrl;
                    document.getElementById('previewImg').src = imgUrl;
                    document.getElementById('resultBox').classList.add('show');
                    setTip('✅ 生成成功', 'success');
                } else {
                    setTip('生成失败，返回：' + JSON.stringify(data).substring(0, 100), 'error');
                }
            });
        }

        function previewImg() {
            if (currentImgUrl) {
                document.getElementById('previewImg').src = currentImgUrl;
                document.getElementById('previewOverlay').classList.add('show');
            }
        }

        function closePreview() {
            document.getElementById('previewOverlay').classList.remove('show');
        }

        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                startDraw();
            }
        });
    </script>
</body>
</html>
